# Lieferketten-Tor (docs/SICHERHEIT.md 4.2, Anhang C). Ausnahmen nur mit Eintrag in docs/SICHERHEIT-AUSNAHMEN.md.
# Prüfen: cargo deny --locked check advisories bans licenses sources
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
# Je Zeile ein Eintrag in docs/SICHERHEIT-AUSNAHMEN.md (A-004 bis A-006), Begründung aus haertung-libsqlite3-chrono.
ignore = [
  { id = "RUSTSEC-2026-0459", reason = "Lokale Lücke (präparierte DB- und WAL-Datei). Der Kern bündelt kein SQLite (nur in Tests); die Apps nutzen SQLCipher, dessen Quelle auch in libsqlite3-sys 0.39 noch ein betroffenes SQLite enthält. Neu prüfen, sobald sqlcipher-src SQLite >= 3.54 enthält." },
  { id = "RUSTSEC-2026-0543", reason = "chrono nicht mehr gepflegt, keine bekannte Lücke. Ersatz ist ein eigener Auftrag (Wiederholungsregeln hängen daran)." },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz nicht mehr gepflegt, keine bekannte Lücke. Ersatz zusammen mit chrono." },
]

[licenses]
# Nur Lizenzen, die mit MIT verträglich sind.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "0BSD", "BSL-1.0", "MPL-2.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "openssl", reason = "TLS nur über rustls (SICHERHEIT 4.2)" },
  { name = "native-tls", reason = "TLS nur über rustls (SICHERHEIT 4.2)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/daedyx/core"]
