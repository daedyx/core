[package]
name = "daedyx-tasks-core"
description = "Daedyx Aufgaben-Kern: Modell, Schema, Abgleich, Wiederholung, Smart-Listen (ohne Oberfläche, ohne eigene Datenbank)"
edition.workspace = true
version.workspace = true
license = "MIT"

[dependencies]
# Ohne Backend-Feature: SQLCipher oder SQLite stellt die App ein.
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
getrandom = "0.3"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
# Eigenschafts- und Missbrauchstests (SICHERHEIT 2.4, docs/ABHAENGIGKEITEN.md)
proptest = { version = "1.12", default-features = false, features = ["std"] }

[lints]
workspace = true
